<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        button:hover {
            background: #5568d3;
        }
        .logout-btn {
            background: #ef4444;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        .hidden {
            display: none;
        }
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .nav button {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid transparent;
        }
        .nav button.active {
            background: #667eea;
            color: white;
        }
        .page {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .page.hidden {
            display: none;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .full-width-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .full-width-btn:hover {
            background: #5568d3;
        }
        .daily-log {
            margin-top: 24px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-entry {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-entry-date {
            font-weight: 600;
            color: #333;
        }
        .log-entry-amount {
            font-weight: bold;
            color: #667eea;
        }
        .auth-section {
            text-align: center;
            padding: 40px 20px;
        }
        .auth-section button {
            padding: 12px 32px;
            font-size: 16px;
        }
        .user-info {
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div class="auth-section" id="authSection">
            <h1 style="margin-bottom: 20px; color: #667eea;">💰 Budget Tracker</h1>
            <p style="margin-bottom: 20px; color: #666;">Sign in to track your monthly budget</p>
            <button onclick="login()">Sign in with Google</button>
        </div>

        <!-- App Section -->
        <div class="hidden" id="appSection">
            <div class="header">
                <h1>💰 Budget Tracker</h1>
                <div class="auth-buttons">
                    <div class="user-info" id="userName"></div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Navigation -->
            <div class="nav">
                <button class="active" onclick="switchPage('dashboard')">Dashboard</button>
                <button onclick="switchPage('settings')">Settings & Log</button>
            </div>

            <!-- Dashboard Page -->
            <div id="dashboard" class="page">
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">Monthly Budget</div>
                        <div class="stat-value" id="monthlyBudgetDisplay">$0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Daily Fixed</div>
                        <div class="stat-value" id="dailyFixedDisplay">$0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Today's Budget</div>
                        <div class="stat-value" id="dailyCumulativeDisplay">$0</div>
                    </div>
                </div>

                <div class="section-title">Daily Budget Trend</div>
                <div class="chart-container">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <!-- Settings & Log Page -->
            <div id="settings" class="page hidden">
                <div class="section-title">Set Monthly Budget</div>
                <div class="form-group">
                    <label>Monthly Budget ($)</label>
                    <input type="number" id="monthlyBudgetInput" placeholder="e.g., 750" min="0" step="0.01">
                </div>
                <button class="full-width-btn" onclick="setupBudget()">Set Budget</button>

                <div style="margin-top: 32px; padding-top: 24px; border-top: 2px solid #f0f0f0;">
                    <div class="section-title">Monthly Overview</div>
                    <div class="chart-container">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>

                <div style="margin-top: 32px; padding-top: 24px; border-top: 2px solid #f0f0f0;">
                    <div class="section-title">Log Daily Spending</div>
                    <div class="form-group">
                        <label>Amount Spent Today ($)</label>
                        <input type="number" id="dailySpendingInput" placeholder="e.g., 25" min="0" step="0.01">
                    </div>
                    <button class="full-width-btn" onclick="logSpending()">Log Spending</button>

                    <div class="daily-log">
                        <div class="section-title" style="margin-top: 24px;">This Month's Log</div>
                        <div id="logList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5FGCVlllBY6OKFmf6sYYc6-tixB9x9bg",
            authDomain: "budget-app-4ac30.firebaseapp.com",
            projectId: "budget-app-4ac30",
            storageBucket: "budget-app-4ac30.firebasestorage.app",
            messagingSenderId: "178215472109",
            appId: "1:178215472109:web:bb5676f6ed399bb806f5e4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let currentMonth = new Date().toISOString().slice(0, 7);
        let dailyChart = null;
        let monthlyChart = null;

        window.login = async function() {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        };

        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                alert('Logout failed: ' + error.message);
            }
        };

        window.switchPage = function(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

            if (page === 'dashboard') {
                document.getElementById('dashboard').classList.remove('hidden');
                document.querySelectorAll('.nav button')[0].classList.add('active');
                if (dailyChart) updateDailyChart();
            } else {
                document.getElementById('settings').classList.remove('hidden');
                document.querySelectorAll('.nav button')[1].classList.add('active');
                if (monthlyChart) updateMonthlyChart();
            }
        };

        window.setupBudget = async function() {
            const amount = parseFloat(document.getElementById('monthlyBudgetInput').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid budget amount');
                return;
            }

            try {
                const budgetRef = doc(db, 'users', currentUser.uid, 'budgets', currentMonth);
                await setDoc(budgetRef, {
                    monthlyBudget: amount,
                    createdAt: new Date(),
                    logs: []
                }, { merge: true });

                await loadBudgetData();
                alert(`Budget set to $${amount.toFixed(2)} for ${currentMonth}`);
            } catch (error) {
                alert('Failed to set budget: ' + error.message);
            }
        };

        window.logSpending = async function() {
            const amount = parseFloat(document.getElementById('dailySpendingInput').value);
            if (!amount || amount < 0) {
                alert('Please enter a valid amount');
                return;
            }

            try {
                const today = new Date().toISOString().split('T')[0];
                const budgetRef = doc(db, 'users', currentUser.uid, 'budgets', currentMonth);
                const docSnap = await getDoc(budgetRef);

                if (!docSnap.exists()) {
                    alert('Please set a budget first');
                    return;
                }

                const logs = docSnap.data().logs || [];
                const existingIndex = logs.findIndex(log => log.date === today);

                if (existingIndex >= 0) {
                    logs[existingIndex].amount = amount;
                } else {
                    logs.push({ date: today, amount });
                }

                logs.sort((a, b) => new Date(a.date) - new Date(b.date));

                await updateDoc(budgetRef, { logs });
                document.getElementById('dailySpendingInput').value = '';
                await loadBudgetData();
            } catch (error) {
                alert('Failed to log spending: ' + error.message);
            }
        };

        async function loadBudgetData() {
            try {
                const budgetRef = doc(db, 'users', currentUser.uid, 'budgets', currentMonth);
                const docSnap = await getDoc(budgetRef);

                if (!docSnap.exists()) {
                    return;
                }

                const data = docSnap.data();
                const monthlyBudget = data.monthlyBudget;
                const logs = data.logs || [];

                const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
                const dailyAllowance = monthlyBudget / daysInMonth;

                document.getElementById('monthlyBudgetInput').value = monthlyBudget;
                document.getElementById('monthlyBudgetDisplay').textContent = `$${monthlyBudget.toFixed(2)}`;
                document.getElementById('dailyFixedDisplay').textContent = `$${dailyAllowance.toFixed(2)}`;

                let cumulativeBalance = 0;
                let totalSpent = 0;
                const logHtml = [];
                const dailyData = [];

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${currentMonth}-${String(day).padStart(2, '0')}`;
                    const log = logs.find(l => l.date === dateStr);
                    const spent = log ? log.amount : 0;
                    const difference = dailyAllowance - spent;
                    cumulativeBalance += difference;
                    totalSpent += spent;

                    dailyData.push({
                        date: dateStr,
                        fixed: dailyAllowance,
                        cumulative: cumulativeBalance + dailyAllowance
                    });

                    if (log) {
                        const dateObj = new Date(dateStr);
                        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                        logHtml.push(`
                            <div class="log-entry">
                                <div class="log-entry-date">${dayName}</div>
                                <div class="log-entry-amount">$${spent.toFixed(2)}</div>
                            </div>
                        `);
                    }
                }

                const today = new Date().toISOString().split('T')[0];
                const todayLog = logs.find(l => l.date === today);
                let todayBudget = dailyAllowance;
                if (todayLog) {
                    const todayIndex = dailyData.findIndex(d => d.date === today);
                    if (todayIndex >= 0) {
                        todayBudget = dailyData[todayIndex].cumulative;
                    }
                } else {
                    if (dailyData.length > 0) {
                        const lastDay = dailyData.findIndex(d => d.date === today);
                        if (lastDay > 0) {
                            todayBudget = dailyData[lastDay - 1].cumulative + dailyAllowance;
                        }
                    }
                }

                document.getElementById('dailyCumulativeDisplay').textContent = `$${todayBudget.toFixed(2)}`;
                document.getElementById('logList').innerHTML = logHtml.join('');

                updateDailyChart(dailyData, dailyAllowance);
                updateMonthlyChart(monthlyBudget, totalSpent);
            } catch (error) {
                console.error('Load error:', error);
            }
        }

        function updateDailyChart(dailyData, dailyAllowance) {
            const ctx = document.getElementById('dailyChart');
            if (!ctx) return;

            const labels = dailyData.map(d => {
                const date = new Date(d.date);
                return date.getDate();
            });

            const fixedData = dailyData.map(d => d.fixed);
            const cumulativeData = dailyData.map(d => d.cumulative);

            if (dailyChart) {
                dailyChart.data.labels = labels;
                dailyChart.data.datasets[0].data = fixedData;
                dailyChart.data.datasets[1].data = cumulativeData;
                dailyChart.update();
            } else {
                dailyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Daily Fixed Budget',
                                data: fixedData,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                tension: 0.4,
                                borderWidth: 2
                            },
                            {
                                label: 'Daily Cumulative Budget',
                                data: cumulativeData,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                tension: 0.4,
                                borderWidth: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }

        function updateMonthlyChart(monthlyBudget, totalSpent) {
            const ctx = document.getElementById('monthlyChart');
            if (!ctx) return;

            const remaining = monthlyBudget - totalSpent;

            if (monthlyChart) {
                monthlyChart.data.datasets[0].data = [monthlyBudget, totalSpent, remaining > 0 ? remaining : 0];
                monthlyChart.update();
            } else {
                monthlyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Budget', 'Spent', 'Remaining'],
                        datasets: [{
                            label: 'Amount ($)',
                            data: [monthlyBudget, totalSpent, remaining > 0 ? remaining : 0],
                            backgroundColor: ['#667eea', '#ef4444', '#10b981']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('userName').textContent = `${user.displayName || user.email}`;
                currentMonth = new Date().toISOString().slice(0, 7);
                await loadBudgetData();
            } else {
                currentUser = null;
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('appSection').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
