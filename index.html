<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        button:hover {
            background: #5568d3;
        }
        .logout-btn {
            background: #ef4444;
        }
        .logout-btn:hover {
            background: #dc2626;
        }
        .hidden {
            display: none;
        }
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        .nav button {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid transparent;
        }
        .nav button.active {
            background: #667eea;
            color: white;
        }
        .page {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .page.hidden {
            display: none;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .full-width-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .full-width-btn:hover {
            background: #5568d3;
        }
        .daily-log {
            margin-top: 24px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-entry {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-entry-date {
            font-weight: 600;
            color: #333;
        }
        .log-entry-amount {
            font-weight: bold;
            color: #667eea;
        }
        .auth-section {
            text-align: center;
            padding: 40px 20px;
        }
        .auth-section button {
            padding: 12px 32px;
            font-size: 16px;
        }
        .user-info {
            color: #999;
            font-size: 12px;
        }
        .month-section {
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }
        .month-header {
            background: #667eea;
            color: white;
            padding: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .month-header:hover {
            background: #5568d3;
        }
        .month-header.collapsed::after {
            content: "▶";
        }
        .month-header.expanded::after {
            content: "▼";
        }
        .month-content {
            padding: 16px;
            display: none;
        }
        .month-content.expanded {
            display: block;
        }
        .day-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .day-label {
            font-weight: 600;
            color: #333;
        }
        .day-value {
            text-align: right;
            color: #667eea;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .stat-box.balance-positive {
            border-left-color: #10b981;
        }
        .stat-box.balance-positive .stat-value {
            color: #10b981;
        }
        .stat-box.balance-negative {
            border-left-color: #ef4444;
        }
        .stat-box.balance-negative .stat-value {
            color: #ef4444;
        }
        .day-row.projected {
            background: #fff8ec;
        }
        .day-row.projected .day-label {
            color: #b45309;
        }
        .day-row.projected .day-value {
            color: #f59e0b;
        }
        .status {
            display: inline-block;
            width: 16px;
            text-align: center;
            font-weight: 700;
            margin-right: 4px;
        }
        .status.logged {
            color: #10b981;
        }
        .status.missed {
            color: #ef4444;
        }
        .status.pending {
            color: #9ca3af;
        }
        .history-legend {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .history-legend b {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div class="auth-section" id="authSection">
            <h1 style="margin-bottom: 20px; color: #667eea;">💰 Budget Tracker</h1>
            <p style="margin-bottom: 20px; color: #666;">Sign in to track your monthly budget</p>
            <button onclick="login()">Sign in with Google</button>
        </div>

        <!-- App Section -->
        <div class="hidden" id="appSection">
            <div class="header">
                <h1>💰 Budget Tracker</h1>
                <div class="auth-buttons">
                    <div class="user-info" id="userName"></div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Navigation -->
            <div class="nav">
                <button class="active" onclick="switchPage('dashboard')">Dashboard</button>
                <button onclick="switchPage('settings')">Settings & Log</button>
                <button onclick="switchPage('history')">History</button>
            </div>

            <!-- Dashboard Page -->
            <div id="dashboard" class="page">
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-label">Monthly Budget</div>
                        <div class="stat-value" id="monthlyBudgetDisplay">$0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Daily Fixed</div>
                        <div class="stat-value" id="dailyFixedDisplay">$0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Today's Budget</div>
                        <div class="stat-value" id="dailyCumulativeDisplay">$0</div>
                    </div>
                    <div class="stat-box" id="todayBalanceBox">
                        <div class="stat-label">Today's Balance</div>
                        <div class="stat-value" id="todayBalanceDisplay">$0</div>
                    </div>
                </div>

                <div class="section-title">Daily Budget Trend</div>
                <div class="chart-container">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>

            <!-- Settings & Log Page -->
            <div id="settings" class="page hidden">
                <div class="section-title">Set Monthly Budget</div>
                <div class="form-group">
                    <label>Monthly Budget ($)</label>
                    <input type="number" id="monthlyBudgetInput" placeholder="e.g., 750" min="0" step="0.01">
                </div>
                <button class="full-width-btn" onclick="setupBudget()">Set Budget</button>

                <div style="margin-top: 32px; padding-top: 24px; border-top: 2px solid #f0f0f0;">
                    <div class="section-title">Monthly Overview</div>
                    <div class="chart-container">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>

                <div style="margin-top: 32px; padding-top: 24px; border-top: 2px solid #f0f0f0;">
                    <div class="section-title">Log Daily Spending</div>
                    <div class="form-group">
                        <label>Amount Spent Today ($)</label>
                        <input type="number" id="dailySpendingInput" placeholder="e.g., 25" min="0" step="0.01">
                    </div>
                    <button class="full-width-btn" onclick="logSpending()">Log Spending</button>

                    <div class="daily-log">
                        <div class="section-title" style="margin-top: 24px;">This Month's Log</div>
                        <div id="logList"></div>
                    </div>
                </div>
            </div>

            <!-- History Page -->
            <div id="history" class="page hidden">
                <div class="section-title">All Months</div>
                <div class="history-legend">
                    <span><b style="color:#10b981;">✓</b> logged</span>
                    <span><b style="color:#ef4444;">✗</b> forgot</span>
                    <span><b style="color:#9ca3af;">•</b> today, not yet</span>
                </div>
                <div id="historyContent"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC5FGCVlllBY6OKFmf6sYYc6-tixB9x9bg",
            authDomain: "budget-app-4ac30.firebaseapp.com",
            projectId: "budget-app-4ac30",
            storageBucket: "budget-app-4ac30.firebasestorage.app",
            messagingSenderId: "178215472109",
            appId: "1:178215472109:web:bb5676f6ed399bb806f5e4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const pad = n => String(n).padStart(2, '0');
        const localDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const parseLocal = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

        let currentUser = null;
        let currentMonth = localDate(new Date()).slice(0, 7);
        let dailyChart = null;
        let monthlyChart = null;

        window.login = async function() {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        };

        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                alert('Logout failed: ' + error.message);
            }
        };

        window.switchPage = function(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));

            if (page === 'dashboard') {
                document.getElementById('dashboard').classList.remove('hidden');
                document.querySelectorAll('.nav button')[0].classList.add('active');
                setTimeout(() => {
                    if (dailyChart) dailyChart.resize();
                }, 100);
            } else if (page === 'settings') {
                document.getElementById('settings').classList.remove('hidden');
                document.querySelectorAll('.nav button')[1].classList.add('active');
                setTimeout(() => {
                    if (monthlyChart) monthlyChart.resize();
                }, 100);
            } else if (page === 'history') {
                document.getElementById('history').classList.remove('hidden');
                document.querySelectorAll('.nav button')[2].classList.add('active');
                loadHistoryPage();
            }
        };

        window.setupBudget = async function() {
            const amount = parseFloat(document.getElementById('monthlyBudgetInput').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid budget amount');
                return;
            }

            try {
                const budgetRef = doc(db, 'users', currentUser.uid, 'budgets', currentMonth);
                await setDoc(budgetRef, {
                    monthlyBudget: amount,
                    createdAt: new Date(),
                    logs: []
                }, { merge: true });

                await loadBudgetData();
                alert(`Budget set to $${amount.toFixed(2)} for ${currentMonth}`);
            } catch (error) {
                alert('Failed to set budget: ' + error.message);
            }
        };

        window.logSpending = async function() {
            const amount = parseFloat(document.getElementById('dailySpendingInput').value);
            if (isNaN(amount) || amount < 0) {
                alert('Please enter a valid amount');
                return;
            }

            try {
                const today = localDate(new Date());
                const budgetRef = doc(db, 'users', currentUser.uid, 'budgets', currentMonth);
                const docSnap = await getDoc(budgetRef);

                if (!docSnap.exists()) {
                    alert('Please set a budget first');
                    return;
                }

                const logs = docSnap.data().logs || [];
                const existingIndex = logs.findIndex(log => log.date === today);

                if (existingIndex >= 0) {
                    logs[existingIndex].amount = amount;
                } else {
                    logs.push({ date: today, amount });
                }

                logs.sort((a, b) => new Date(a.date) - new Date(b.date));

                await updateDoc(budgetRef, { logs });
                document.getElementById('dailySpendingInput').value = '';
                await loadBudgetData();
            } catch (error) {
                alert('Failed to log spending: ' + error.message);
            }
        };

        async function loadBudgetData() {
            try {
                const budgetRef = doc(db, 'users', currentUser.uid, 'budgets', currentMonth);
                const docSnap = await getDoc(budgetRef);

                if (!docSnap.exists()) {
                    return;
                }

                const data = docSnap.data();
                const monthlyBudget = data.monthlyBudget;
                const logs = data.logs || [];

                const [cy, cm] = currentMonth.split('-').map(Number);
                const daysInMonth = new Date(cy, cm, 0).getDate();
                const dailyAllowance = monthlyBudget / daysInMonth;
                const todayDay = new Date().getDate();

                document.getElementById('monthlyBudgetInput').value = monthlyBudget;
                document.getElementById('monthlyBudgetDisplay').textContent = `$${monthlyBudget.toFixed(2)}`;
                document.getElementById('dailyFixedDisplay').textContent = `$${dailyAllowance.toFixed(2)}`;

                let rollover = 0;
                let totalSpent = 0;
                let todayBudget = dailyAllowance;
                let todaySpent = 0;
                const logHtml = [];
                const labels = [];
                const fixedData = [];
                const cumulativeData = [];

                // Walk the whole month. Days up to today use real logs (unlogged = perfect
                // adherence); days after today are a projection assuming no over/underspending.
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${currentMonth}-${pad(day)}`;
                    const log = logs.find(l => l.date === dateStr);
                    const budgetForDay = dailyAllowance + rollover;
                    const spent = log ? log.amount : dailyAllowance;

                    labels.push(day);
                    fixedData.push(dailyAllowance);
                    cumulativeData.push(budgetForDay);

                    if (day === todayDay) {
                        todayBudget = budgetForDay;
                        todaySpent = log ? log.amount : 0;
                    }
                    if (day <= todayDay) totalSpent += spent;

                    rollover += (dailyAllowance - spent);

                    if (log && day <= todayDay) {
                        const dayName = parseLocal(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                        logHtml.push(`
                            <div class="log-entry">
                                <div class="log-entry-date">${dayName}</div>
                                <div class="log-entry-amount">$${log.amount.toFixed(2)}</div>
                            </div>
                        `);
                    }
                }

                const todayBalance = todayBudget - todaySpent;
                document.getElementById('dailyCumulativeDisplay').textContent = `$${todayBudget.toFixed(2)}`;

                const balanceBox = document.getElementById('todayBalanceBox');
                const sign = todayBalance >= 0 ? '+' : '-';
                document.getElementById('todayBalanceDisplay').textContent = `${sign}$${Math.abs(todayBalance).toFixed(2)}`;
                balanceBox.classList.remove('balance-positive', 'balance-negative');
                balanceBox.classList.add(todayBalance >= 0 ? 'balance-positive' : 'balance-negative');

                document.getElementById('logList').innerHTML = logHtml.join('') || '<div class="empty-state">No spending logged yet</div>';

                updateDailyChart(labels, fixedData, cumulativeData, todayDay);
                updateMonthlyChart(monthlyBudget, totalSpent);
            } catch (error) {
                console.error('Load error:', error);
            }
        }

        function updateDailyChart(labels, fixedData, cumulativeData, todayDay) {
            const ctx = document.getElementById('dailyChart');
            if (!ctx) return;

            const dashFrom = todayDay - 1; // 0-based index of today; segments from here on are projected
            const dashSegment = { borderDash: c => c.p0DataIndex >= dashFrom ? [6, 6] : undefined };

            if (dailyChart) {
                dailyChart.data.labels = labels;
                dailyChart.data.datasets[0].data = fixedData;
                dailyChart.data.datasets[1].data = cumulativeData;
                dailyChart.data.datasets[1].segment = dashSegment;
                dailyChart.update();
            } else {
                dailyChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Daily Fixed Budget',
                                data: fixedData,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                tension: 0.1,
                                borderWidth: 2,
                                pointRadius: 0
                            },
                            {
                                label: 'Daily Cumulative Budget (dashed = projected)',
                                data: cumulativeData,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                tension: 0.1,
                                borderWidth: 2,
                                pointRadius: 0,
                                segment: dashSegment
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });
            }
        }

        function updateMonthlyChart(monthlyBudget, totalSpent) {
            const ctx = document.getElementById('monthlyChart');
            if (!ctx) return;

            const remaining = monthlyBudget - totalSpent;

            if (monthlyChart) {
                monthlyChart.data.datasets[0].data = [monthlyBudget, totalSpent, remaining > 0 ? remaining : 0];
                monthlyChart.update();
            } else {
                monthlyChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Budget', 'Spent', 'Remaining'],
                        datasets: [{
                            label: 'Amount ($)',
                            data: [monthlyBudget, totalSpent, remaining > 0 ? remaining : 0],
                            backgroundColor: ['#667eea', '#ef4444', '#10b981']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }

        async function loadHistoryPage() {
            try {
                const budgetsRef = collection(db, 'users', currentUser.uid, 'budgets');
                const querySnapshot = await getDocs(budgetsRef);

                if (querySnapshot.empty) {
                    document.getElementById('historyContent').innerHTML = '<div class="empty-state">No data yet</div>';
                    return;
                }

                const months = [];
                querySnapshot.forEach(doc => {
                    months.push({ id: doc.id, data: doc.data() });
                });

                months.sort((a, b) => b.id.localeCompare(a.id));

                const currentMonthStr = localDate(new Date()).slice(0, 7);
                const todayDay = new Date().getDate();

                let html = '';
                for (const month of months) {
                    const monthId = month.id;
                    const logs = month.data.logs || [];
                    const monthlyBudget = month.data.monthlyBudget || 0;
                    const [my, mm] = monthId.split('-').map(Number);
                    const daysInMonth = new Date(my, mm, 0).getDate();
                    const dailyAllowance = monthlyBudget / daysInMonth;
                    const isCurrent = monthId === currentMonthStr;
                    const loggedDays = new Set(logs.map(l => Number(l.date.split('-')[2])));
                    const startDay = logs.length ? Math.min(...loggedDays) : null;

                    html += `
                        <div class="month-section">
                            <div class="month-header collapsed" onclick="toggleMonth(this, '${monthId}')">
                                ${monthId}
                            </div>
                            <div class="month-content" id="month-${monthId}">
                                <div class="day-row" style="font-weight:600;background:#eef1ff;">
                                    <div>Day</div>
                                    <div style="text-align:right">Spent</div>
                                    <div style="text-align:right">Fixed</div>
                                    <div style="text-align:right">Cumulative</div>
                                </div>
                    `;

                    let rollover = 0;
                    for (let day = 1; day <= daysInMonth; day++) {
                        const dateStr = `${monthId}-${pad(day)}`;
                        const log = logs.find(l => l.date === dateStr);
                        const budgetForDay = dailyAllowance + rollover;
                        const spent = log ? log.amount : dailyAllowance;
                        rollover += (dailyAllowance - spent);

                        const isFuture = isCurrent && day > todayDay;
                        const dayName = parseLocal(dateStr).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
                        const spentDisplay = log ? `$${log.amount.toFixed(2)}` : '—';

                        let status = '';
                        if (startDay !== null && day >= startDay && !isFuture) {
                            if (loggedDays.has(day)) {
                                status = '<span class="status logged">✓</span>';
                            } else if (isCurrent && day === todayDay) {
                                status = '<span class="status pending">•</span>';
                            } else {
                                status = '<span class="status missed">✗</span>';
                            }
                        }

                        html += `
                            <div class="day-row${isFuture ? ' projected' : ''}">
                                <div class="day-label">${status}${dayName}</div>
                                <div class="day-value">${spentDisplay}</div>
                                <div class="day-value">$${dailyAllowance.toFixed(2)}</div>
                                <div class="day-value">$${budgetForDay.toFixed(2)}</div>
                            </div>
                        `;
                    }

                    html += `
                            </div>
                        </div>
                    `;
                }

                document.getElementById('historyContent').innerHTML = html;
            } catch (error) {
                console.error('History load error:', error);
            }
        }

        window.toggleMonth = function(header, monthId) {
            header.classList.toggle('collapsed');
            header.classList.toggle('expanded');
            document.getElementById(`month-${monthId}`).classList.toggle('expanded');
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('userName').textContent = `${user.displayName || user.email}`;
                currentMonth = localDate(new Date()).slice(0, 7);
                await loadBudgetData();
            } else {
                currentUser = null;
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('appSection').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
